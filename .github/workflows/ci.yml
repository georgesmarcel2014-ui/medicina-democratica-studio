name: Verificações

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Instalar dependências fixadas
        run: npm ci --no-audit --no-fund
      - name: Verificar tipos
        run: npm run typecheck
      - name: Executar testes
        run: npm test

  production-container:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construir a imagem de hospedagem
        run: docker build --tag studio-ci .
      - name: Conferir o inicializador do Windows
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/start-studio.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join "`n") }
      - name: Verificar execução local com segredos do Compose
        run: |
          docker tag studio-ci medicina-democratica-studio:local
          export STUDIO_API_TOKEN="$(openssl rand -hex 32)"
          export GEMINI_API_KEY=' '
          trap 'docker compose down --volumes' EXIT
          docker compose up --no-build --wait --wait-timeout 60
          docker compose exec -T --user node studio sh -c '
            test -r /run/secrets/studio_api_token && test -r /run/secrets/gemini_api_key &&
            test "$(stat -c %a /run/secrets/studio_api_token)" = 400 &&
            test "$(stat -c %a /run/secrets/gemini_api_key)" = 400 &&
            test -z "${STUDIO_API_TOKEN:-}${GEMINI_API_KEY:-}"
          '
          job='http://127.0.0.1:8787/v1/jobs/00000000-0000-4000-8000-000000000000'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$job")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $STUDIO_API_TOKEN" "$job")" = 404
      - name: Gerar fala sintética em português
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends espeak-ng
          espeak-ng -v pt-br -s 148 -w "$RUNNER_TEMP/studio-test.wav" 'A ciência começa com uma pergunta. A pesquisa ajuda a encontrar respostas.'
      - name: Verificar serviço e produção no contêiner
        run: |
          export STUDIO_API_TOKEN="$(openssl rand -hex 32)"
          docker volume create studio-ci-jobs
          trap 'docker rm -f studio-ci >/dev/null 2>&1 || true; docker volume rm studio-ci-jobs >/dev/null 2>&1 || true' EXIT
          docker run --detach --name studio-ci --network none --cpus 1 --memory 2g \
            --env STUDIO_API_TOKEN \
            --mount type=volume,source=studio-ci-jobs,target=/var/data \
            --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/studio-test.wav,target=/fixture.wav,readonly" studio-ci
          for attempt in {1..10}; do
            if docker exec --user node studio-ci node -e 'fetch("http://127.0.0.1:10000/healthz").then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));'; then
              docker exec --user node --env STUDIO_TEST_SPEECH_WAV=/fixture.wav studio-ci npm run test:production
              exit "$?"
            fi
            sleep 1
          done
          docker logs studio-ci
          exit 1
