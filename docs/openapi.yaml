openapi: 3.1.0
info:
  title: Medicina Democrática Studio — API privada
  version: 0.2.0
  description: |
    API de operador único com fila local, consulta e downloads autenticados.
    Um único token autoriza os trabalhos do estúdio. Arquivos ficam no diretório
    privado STUDIO_JOBS_DIR. Após reinício, trabalhos pendentes ou ativos recebem INTERRUPTED.
servers:
  - url: https://studio.example.invalid
    description: Endereço ilustrativo. Use a URL HTTPS da hospedagem.
security:
  - StudioBearer: []
paths:
  /:
    get:
      operationId: openStudio
      summary: Abrir o formulário de produção
      security: []
      responses:
        '200':
          description: Formulário HTML para roteiro aprovado, WAV opcional e downloads
          content:
            text/html:
              schema: {type: string}
  /ui.js:
    get:
      operationId: studioInterfaceScript
      summary: JavaScript do formulário
      security: []
      responses:
        '200':
          description: Script estático
          content:
            application/javascript:
              schema: {type: string}
  /healthz:
    get:
      operationId: checkStudioHealth
      summary: Consultar a disponibilidade do processo
      security: []
      responses:
        '200': {description: API inicializada}
  /v1/jobs:
    post:
      operationId: createProductionJob
      summary: Enfileirar produção a partir de roteiro aprovado
      description: |
        Para gerar a narração, use application/json ou envie episode.json em
        multipart. Declare audio.source google-tts, audio.path narration.wav e
        audio.scriptApproved true. O servidor gera o WAV com Google TTS e as
        legendas com reconhecimento local.
        Para reutilizar um WAV, envie episode.json e narration.wav em multipart
        com audio.source google-ai-studio e audio.approved true. Inclua
        episode.captions para usar legendas já temporizadas.
        Envie os assets declarados em multipart, com nomes de arquivo únicos,
        sem caminhos ou URLs. final.mp4 é reservado para a saída.
        Limites de upload são 52 arquivos, 256 KiB para episode.json, 256 MiB por
        arquivo e 512 MiB somados. A fila aceita até dez uploads ou jobs ativos.
        O áudio é validado após enfileirar e pode durar até 179 segundos.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomatedEpisode'}
          multipart/form-data:
            schema:
              type: object
              required: [episode]
              properties:
                episode:
                  type: string
                  format: binary
                  description: episode.json conforme src/shared/schema.ts.
                narration:
                  type: string
                  format: binary
                  description: narration.wav, obrigatório para WAV definitivo enviado.
                assets:
                  type: array
                  items: {type: string, format: binary}
                  description: Mídias locais declaradas no episódio.
            encoding:
              episode: {contentType: application/json}
              narration: {contentType: audio/wav}
      responses:
        '202':
          description: Job aceito
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {description: Upload excede o limite}
        '415': {description: Envie application/json ou multipart/form-data}
        '429': {description: Fila cheia}
        '503': {description: TTS ou alinhador automático indisponível na configuração do servidor}
  /v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getProductionJob
      summary: Consultar estado ou código de falha
      responses:
        '200':
          description: Estado atual, sem conteúdo de produção
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Job inexistente}
  /v1/jobs/{id}/video:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: downloadProductionVideo
      summary: Baixar MP4 concluído
      responses:
        '200':
          description: MP4 final como attachment
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Job ou vídeo inexistente}
        '409': {description: Vídeo ainda indisponível ou render falhou}
  /v1/jobs/{id}/captions:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: downloadProductionCaptions
      summary: Baixar o SRT do MP4 concluído
      responses:
        '200':
          description: Legendas SRT como attachment
          content:
            application/x-subrip:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Job ou legendas inexistentes}
        '409': {description: Legendas finais ainda indisponíveis}
  /v1/jobs/{id}/narration:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: downloadProductionNarration
      summary: Recuperar o WAV de um job encerrado
      responses:
        '200':
          description: WAV gerado ou enviado, como attachment
          content:
            audio/wav:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Job ou narração inexistente}
        '409': {description: Job ainda ativo}
components:
  securitySchemes:
    StudioBearer:
      type: http
      scheme: bearer
      description: Token privado do estúdio configurado em STUDIO_API_TOKEN.
  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    AutomatedEpisode:
      type: object
      required: [title, series, script, visualIdentity, audio]
      properties:
        title: {type: string, minLength: 1, maxLength: 140}
        series: {type: string, enum: [noticias, historia, na-pratica]}
        script: {type: string, minLength: 1, maxLength: 15000}
        visualIdentity: {type: string, const: medicina-democratica}
        audio:
          type: object
          required: [path, source, scriptApproved]
          additionalProperties: false
          properties:
            path: {type: string, const: narration.wav}
            source: {type: string, const: google-tts}
            scriptApproved: {type: boolean, const: true}
        instructions: {type: string, maxLength: 10000}
        transcript: {type: string, minLength: 1}
        scenes:
          type: array
          maxItems: 100
          items: {type: object}
          description: Cenas opcionais conforme src/shared/schema.ts, sem referência a assets.
        assets: {type: array, maxItems: 0}
      additionalProperties: false
    Job:
      type: object
      required: [id, status, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, rendering, completed, failed]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        error:
          type: string
          enum: [TTS_FAILED, TTS_ACCESS_DENIED, TTS_RATE_LIMITED, NARRATION_TOO_LONG, INVALID_NARRATION, CAPTIONS_FAILED, CAPTIONS_MISMATCH, RENDER_FAILED, INTERRUPTED]
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
  responses:
    InvalidInput:
      description: JSON, upload ou caminho inválido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Bearer ausente ou inválido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
